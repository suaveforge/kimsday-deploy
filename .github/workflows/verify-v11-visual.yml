name: Verify KIMSDAY V11 background viewport and phrases
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-v11-visual.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify-v11:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      - name: Test public page artwork, words and TTS
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/kimsday-v11" --silent --no-audit --no-fund playwright-core@1.56.1
          export LIB="$RUNNER_TEMP/kimsday-v11/node_modules/playwright-core"
          node <<'NODE'
          const {chromium}=require(process.env.LIB);
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--autoplay-policy=no-user-gesture-required']});
            const logs=[];
            const page=await browser.newPage({viewport:{width:1650,height:900},deviceScaleFactor:1});
            page.on('pageerror',e=>logs.push(e.message));
            for(let a=0;a<16;a++){
              await page.goto('https://kimsday.suaveforge.com/',{waitUntil:'domcontentloaded',timeout:40000});
              const ver=await page.locator('main.page').getAttribute('data-build');
              if(ver==='KIMSDAY-V11-FULL-WORLD-ROBOT-20261118')break;
              if(a===15)throw Error('old build='+ver);
              await page.waitForTimeout(4500);
            }
            await page.waitForTimeout(1800);
            const data=await page.evaluate(async()=>{
              const e=document.querySelector('.ruins-matte'),style=getComputedStyle(e),p=document.querySelector('main.page');
              const a=document.querySelector('#doomAudio');
              const words=[...document.querySelectorAll('.impact-words')].map(el=>el.textContent.replace(/\s+/g,' ').trim());
              const bg=style.backgroundImage;
              const u=await fetch('assets/ruins-v11.webp',{cache:'no-store'});
              return {version:p.dataset.build,bg,box:e.getBoundingClientRect().toJSON(),pageHeight:p.scrollHeight,imageStatus:u.status,bytes:(await u.arrayBuffer()).byteLength,words,speech:'speechSynthesis' in window,robotFunc:[...document.querySelectorAll('script')].some(el=>el.textContent.includes('robotResignation')),audioSrc:a.currentSrc,paused:a.paused};
            });
            if(data.imageStatus!==200||data.bytes<70000||!data.bg.includes('ruins-v11.webp'))throw Error('background missing: '+JSON.stringify(data));
            if(data.box.height+4<900)throw Error('background does not cover visible desktop viewport '+JSON.stringify(data));
            if(!data.words[1].includes('탈출 신호가')||!data.words[1].includes('포착됐다')||!data.words[2].includes('스스로 떠날 것인가')||!data.words[2].includes('쫓겨날 것인가'))throw Error('wrong slogan '+JSON.stringify(data.words));
            if(!data.robotFunc)throw Error('missing robot speech handler');
            if(logs.length)throw Error('JS errors '+JSON.stringify(logs));
            await page.screenshot({path:'/tmp/kimsday-v11-desktop.png',fullPage:true});
            const mobile=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            mobile.on('pageerror',e=>logs.push('mobile:'+e.message));
            await mobile.goto('https://kimsday.suaveforge.com/',{waitUntil:'domcontentloaded'});
            const dims=await mobile.evaluate(()=>({vw:innerWidth,sw:document.documentElement.scrollWidth,matte:Math.round(document.querySelector('.ruins-matte').getBoundingClientRect().height),page:document.querySelector('main.page').scrollHeight}));
            if(dims.sw>dims.vw+8)throw Error('mobile horizontal overflow '+JSON.stringify(dims));
            if(logs.length)throw Error('JS errors '+JSON.stringify(logs));
            await mobile.screenshot({path:'/tmp/kimsday-v11-mobile.png',fullPage:true});
            console.log('KIMSDAY_V11_PUBLIC_VISUAL=PASS '+JSON.stringify({version:data.version,imageStatus:data.imageStatus,bytes:data.bytes,height:data.box.height,pageHeight:data.pageHeight,words:data.words,audioSrc:data.audioSrc,paused:data.paused,robotFunc:data.robotFunc,mobile:dims,errors:logs.length}));
            await browser.close();
          })().catch(e=>{console.error('KIMSDAY_V11_PUBLIC_VISUAL=FAIL',e.stack||e);process.exit(1)});
          NODE
