name: Verify KIM'S DAY V7 live effects
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-site.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify V7 custom domain and real explosion engine
        shell: bash
        run: |
          set -Eeuo pipefail
          for i in $(seq 1 18); do
            HTML=$(curl -LsS --connect-timeout 8 --max-time 22 -o /tmp/kimsday-v7.html -w '%{http_code}' 'https://kimsday.suaveforge.com/' || true)
            echo "HTML_ATTEMPT=$i STATUS=$HTML"
            if [ "$HTML" = 200 ] && grep -Fq 'KIMSDAY-V7-LIVE-EXPLOSION-20261118' /tmp/kimsday-v7.html; then break; fi
            sleep 7
          done
          test "$HTML" = 200
          grep -Fq 'KIMSDAY-V7-LIVE-EXPLOSION-20261118' /tmp/kimsday-v7.html
          grep -Fq 'assets/impact-v7.js' /tmp/kimsday-v7.html
          grep -Fq 'assets/impact-v7.css' /tmp/kimsday-v7.html
          ! grep -Fq 'background:url("assets/kimsday-barrage.webp")' /tmp/kimsday-v7.html
          grep -Fq '1.5베' /tmp/kimsday-v7.html
          for t in js css; do
            CODE=$(curl -LsS --connect-timeout 8 --max-time 20 -o /tmp/kimsday-impact.$t -w '%{http_code}' "https://kimsday.suaveforge.com/assets/impact-v7.$t" || true)
            echo "IMPACT_$t HTTP=$CODE"
            test "$CODE" = 200
          done
          grep -Fq 'function impact(s)' /tmp/kimsday-impact.js
          grep -Fq 'setTimeout(()=>{el.classList.add' /tmp/kimsday-impact.js
          grep -Fq 'death-glyph-forge' /tmp/kimsday-impact.css
          echo 'KIMSDAY_V7_PUBLIC_LIVE_EXPLOSIONS=VERIFIED'
