name: KIMSDAY V8 live visual and interaction QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-v8-browser.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install browser driver
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/kimsday-browser" --silent --no-audit --no-fund playwright-core@1.56.1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "KIMSDAY_CHROME=$CHROME" >> "$GITHUB_ENV"
          echo "KIMSDAY_MODULE_ROOT=$RUNNER_TEMP/kimsday-browser" >> "$GITHUB_ENV"
      - name: Check randomized impacts, disappearing text, moving environment, live audio and mobile
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {chromium}=require(process.env.KIMSDAY_MODULE_ROOT+'/node_modules/playwright-core');
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.KIMSDAY_CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:1});
            const errs=[];page.on('pageerror',e=>errs.push(e.message));
            await page.goto('https://kimsday.suaveforge.com/',{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForFunction(()=>!!window.__kimsdayImpactV7,{timeout:15000});
            const build=await page.locator('main.page').getAttribute('data-build');
            if(!build?.includes('V8-SCATTERED'))throw new Error('old build '+build);
            const badge=await page.locator('.nickname').innerText();
            if(!badge.includes('일베')||!badge.includes('1.5베'))throw new Error('bad 1.5베 context: '+badge);
            await page.waitForTimeout(5700);
            const a=await page.evaluate(()=>window.__kimsdayImpactV7.state);
            if(a.ambientHits<1 || a.hits<1)throw new Error('ambient impacts not running '+JSON.stringify(a));
            await page.evaluate(()=>window.__kimsdayImpactV7.trigger(0));
            const x1=(await page.evaluate(()=>window.__kimsdayImpactV7.state)).impactSites[0].x;
            await page.waitForTimeout(1900);
            const before=await page.locator('.impact-left .impact-words').evaluate(el=>getComputedStyle(el).opacity);
            await page.waitForTimeout(4500);
            const faded=await page.locator('.impact-left .impact-words').evaluate(el=>getComputedStyle(el).opacity);
            if(Number(faded)>.10)throw new Error('words did not fade: '+before+' -> '+faded);
            await page.evaluate(()=>window.__kimsdayImpactV7.trigger(0));
            const x2=(await page.evaluate(()=>window.__kimsdayImpactV7.state)).impactSites[0].x;
            if(Math.abs(x2-x1)<.01)throw new Error('site x not random');
            await page.locator('#audioLaunch').click();
            await page.waitForTimeout(1200);
            const audio=await page.evaluate(()=>{const a=document.getElementById('doomAudio');return {paused:a.paused,position:a.currentTime,pressed:document.getElementById('audioLaunch').getAttribute('aria-pressed')}});
            if(audio.paused||audio.position<=0||audio.pressed!=='true')throw new Error('audio not playing '+JSON.stringify(audio));
            await page.screenshot({path:'/tmp/kimsday-v8-desktop.png'});
            const mobile=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true});
            mobile.on('pageerror',e=>errs.push('mobile: '+e.message));
            await mobile.goto('https://kimsday.suaveforge.com/',{waitUntil:'domcontentloaded',timeout:45000});
            await mobile.waitForFunction(()=>!!window.__kimsdayImpactV7,{timeout:15000});
            await mobile.waitForTimeout(2400);
            const dims=await mobile.evaluate(()=>({width:innerWidth,body:document.documentElement.scrollWidth,hasCanvas:!!document.getElementById('siegeCanvas')}));
            await mobile.screenshot({path:'/tmp/kimsday-v8-mobile.png'});
            if(dims.body>dims.width+6)throw new Error('mobile horizontal overflow '+JSON.stringify(dims));
            if(errs.length)throw new Error('JS errors '+JSON.stringify(errs.slice(0,8)));
            console.log('KIMSDAY_V8_BROWSER_PASS',JSON.stringify({build,badge,ambientHits:a.ambientHits,textOpacity:[before,faded],impactX:[x1,x2],audio,screen:dims,errors:errs.length}));
            await browser.close();
          })().catch(e=>{console.error('KIMSDAY_V8_BROWSER_FAIL',e.stack||String(e));process.exit(1)});
          NODE
