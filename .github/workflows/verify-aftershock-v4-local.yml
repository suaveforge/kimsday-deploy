name: AFTERSHOCK V4 source browser QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-aftershock-v4-local.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with: {chrome-version: stable}
      - name: Install Playwright browser driver
        run: npm install --prefix "$RUNNER_TEMP/chaos-v4-local" --silent --no-audit --no-fund playwright-core@1.56.1
      - name: Browser acceptance gate
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory . >/tmp/kimsday-local-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          export MODULE_PATH="$RUNNER_TEMP/chaos-v4-local/node_modules/playwright-core"
          node <<'NODE'
          const {chromium}=require(process.env.MODULE_PATH);
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--autoplay-policy=no-user-gesture-required']});
            const base='http://127.0.0.1:8765/aftershock/';
            const errors=[];const page=await browser.newPage({viewport:{width:1660,height:935}});
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto(base,{waitUntil:'domcontentloaded',timeout:35000});
            await page.waitForFunction(()=>!!window.__kimsdayImpactV7,{timeout:14000});
            const state=await page.evaluate(()=>{
              const stage=document.querySelector('.impact-stage'),clock=document.querySelector('.clock-shell');
              return {build:document.querySelector('.page').dataset.build,
              clockBottom:clock.getBoundingClientRect().bottom,
              impactTop:stage.getBoundingClientRect().top,
              impactZ:+getComputedStyle(stage).zIndex,
              collageZ:+getComputedStyle(document.querySelector('.chaos-matte')).zIndex,
              gags:document.querySelectorAll('.chaos-gag').length,
              mime:document.querySelector('script[src*=impact-comedy]')?.src,
              width:document.documentElement.scrollWidth,inner:innerWidth};
            });
            if(!state.build.includes('V4-FRONTMOST'))throw Error('wrong build '+JSON.stringify(state));
            if(state.gags!==4||state.impactZ<=state.collageZ||state.width>state.inner+8)throw Error('incorrect layering '+JSON.stringify(state));
            await page.waitForFunction(()=>Array.from(document.querySelectorAll('.impact-omen')).some(el=>el.classList.contains('revealed')&&parseFloat(getComputedStyle(el.querySelector('.impact-words')).opacity)>.85),null,{timeout:14000});
            const visible=await page.evaluate(()=>{
              const active=document.querySelector('.impact-omen.revealed'),w=active.querySelector('.impact-words');
              return {which:active.dataset.omen,caption:+getComputedStyle(w).opacity,
                text:w.innerText,state:window.__kimsdayImpactV7.state,
                top:w.getBoundingClientRect().top,
                clockBottom:document.querySelector('.clock-shell').getBoundingClientRect().bottom};
            });
            if(visible.caption<.85)throw Error('Impact caption not visibly lit '+JSON.stringify(visible));
            await page.screenshot({path:'/tmp/aftershock-v4-desktop.png',fullPage:false});
            await page.waitForTimeout(6100);
            const fade=await page.evaluate((which)=>{
              const el=document.querySelector('.impact-omen[data-omen="'+which+'"]');
              return {alpha:+getComputedStyle(el.querySelector('.impact-words')).opacity,revealed:el.classList.contains('revealed')};
            },visible.which);
            if(fade.alpha>.12 || fade.revealed)throw Error('Fade-out not complete '+JSON.stringify(fade));
            const mobile=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            mobile.on('pageerror',e=>errors.push('mobile '+e.message));
            await mobile.goto(base,{waitUntil:'domcontentloaded'});
            await mobile.waitForFunction(()=>!!window.__kimsdayImpactV7,{timeout:14000});
            const m=await mobile.evaluate(()=>({inner:innerWidth,outer:document.documentElement.scrollWidth,pageHeight:document.querySelector('.page').getBoundingClientRect().height,viewportHeight:innerHeight,gags:document.querySelectorAll('.chaos-gag').length}));
            await mobile.screenshot({path:'/tmp/aftershock-v4-mobile.png',fullPage:true});
            if(m.outer>m.inner+8||m.gags!==4||m.pageHeight>m.viewportHeight+7)throw Error('mobile overflow or vertical gap '+JSON.stringify(m));
            if(errors.length)throw Error('script errors '+JSON.stringify(errors.slice(0,10)));
            console.log('AFTERSHOCK_V4_SOURCE_PASS '+JSON.stringify({state,visible,fade,m,errors:0}));
            await browser.close();
          })().catch(e=>{console.error('AFTERSHOCK_V4_SOURCE_FAIL',e.stack||e);process.exit(1)});
          NODE
      - name: Upload inspected screenshot files
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: aftershock-v4-screens, path: "/tmp/aftershock-v4-*.png", if-no-files-found: ignore}
